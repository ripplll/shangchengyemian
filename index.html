    // ===== 渲染函数（保持不变） =====
    function renderProducts() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card bg-white rounded-xl overflow-hidden shadow-sm cursor-pointer';
            card.innerHTML = `
                <img src="${p.image}" alt="${p.name}" class="w-full h-32 object-cover" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22%3E%3Crect fill=%22%23ddd%22 width=%22300%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2220%22%3E暂无图片%3C/text%3E%3C/svg%3E'" />
                <div class="p-2">
                    <h3 class="font-semibold text-sm truncate">${p.name}</h3>
                    <p class="text-xs text-gray-500 line-clamp-2 mt-1">${p.desc}</p>
                    <div class="flex items-baseline justify-between mt-2">
                        <span class="text-red-600 font-bold text-base">¥${p.price}</span>
                        <span class="text-gray-400 text-xs">/${p.unit}</span>
                    </div>
                </div>
            `;
            card.addEventListener('click', () => showDetail(p));
            grid.appendChild(card);
        });
    }

    // ===== 详情弹窗（保持不变） =====
    function showDetail(product) {
        const overlay = document.createElement('div');
        overlay.className = 'fixed inset-0 bg-black/40 z-20 flex items-end justify-center';
        overlay.innerHTML = `
            <div class="bg-white rounded-t-2xl w-full max-w-lg p-6 animate-slide-up">
                <div class="flex justify-between items-start mb-4">
                    <h2 class="text-lg font-bold">${product.name}</h2>
                    <button onclick="this.closest('.fixed').remove()" class="text-gray-400 text-xl">&times;</button>
                </div>
                <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover rounded-lg mb-4" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22400%22 height=%22300%22%3E%3Crect fill=%22%23ddd%22 width=%22400%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2224%22%3E暂无图片%3C/text%3E%3C/svg%3E'" />
                <p class="text-gray-600 text-sm mb-4">${product.desc}</p>
                <div class="flex items-center justify-between">
                    <span class="text-red-600 text-2xl font-bold">¥${product.price}</span>
                    <span class="text-gray-400">/ ${product.unit}</span>
                </div>
                <button class="mt-6 w-full bg-green-600 text-white py-3 rounded-xl text-lg font-medium">联系购买</button>
            </div>
        `;
        document.body.appendChild(overlay);
        const style = document.createElement('style');
        style.textContent = `@keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } } .animate-slide-up { animation: slide-up 0.3s ease-out; }`;
        document.head.appendChild(style);
    }
