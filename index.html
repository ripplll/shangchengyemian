    // ==================== 渲染商品 ====================
    function renderProducts() {
        const grid = document.getElementById('productGrid');
        grid.innerHTML = '';
        products.forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card bg-white rounded-xl overflow-hidden shadow-sm cursor-pointer';
            card.innerHTML = `
                <img src="${p.image}" alt="${p.name}" class="w-full h-32 object-cover" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22200%22%3E%3Crect fill=%22%23ddd%22 width=%22300%22 height=%22200%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22middle%22 text-anchor=%22middle%22 fill=%22%23999%22 font-size=%2220%22%3E暂无图片%3C/text%3E%3C/svg%3E'" />
                <div class="p-2">
                    <h3 class="font-semibold text-sm truncate">${p.name}</h3>
                    <p class="text-xs text-gray-500 line-clamp-2 mt-1">${p.desc}</p>
                    <div class="flex items-baseline justify-between mt-2">
                        <span class="text-red-600 font-bold text-base">¥${p.price}</span>
                        <span class="text-gray-400 text-xs">/${p.unit}</span>
                    </div>
                </div>
            `;
            card.addEventListener('click', () => openContactModal(p));
            grid.appendChild(card);
        });
    }

    // ==================== 打开联系弹窗（传入商品对象） ====================
    function openContactModal(product) {
        // 填充商品信息
        document.getElementById('modalProductImage').src = product.image;
        document.getElementById('modalProductImage').alt = product.name;
        document.getElementById('modalProductName').textContent = product.name;
        document.getElementById('modalProductDesc').textContent = product.desc;
        document.getElementById('modalProductPrice').textContent = `¥${product.price}`;
        document.getElementById('modalProductUnit').textContent = `/ ${product.unit}`;

        // 显示弹窗
        document.getElementById('contactModal').classList.remove('hidden');
        document.body.style.overflow = 'hidden';
    }

    // ==================== 关闭弹窗 ====================
    function closeContactModal() {
        document.getElementById('contactModal').classList.add('hidden');
        document.body.style.overflow = '';
    }

    // 点击遮罩关闭
    document.getElementById('contactModal').addEventListener('click', function(e) {
        if (e.target === this) closeContactModal();
    });

    // ==================== 复制微信号 ====================
    function copyWechat() {
        const wechatId = 'WR15066857999'; // ← 改成你的微信号
        navigator.clipboard.writeText(wechatId).then(() => {
            alert('微信号已复制，快去微信添加吧！');
        }).catch(() => {
            // 降级方案：提示手动复制
            prompt('请长按复制微信号：', wechatId);
        });
    }

    // ==================== 初始化 ====================
    renderProducts();
